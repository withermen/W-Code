<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>W-Code</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div id="app">
    <aside id="chat">
      <header>
        <div class="logo">W-Code</div>
        <select id="provider">
          <option value="openai">OpenAI</option>
          <option value="anthropic">Anthropic</option>
          <option value="groq">Groq</option>
          <option value="openrouter">OpenRouter</option>
          <option value="ollama">Ollama</option>
          <option value="xai">xAI</option>
        </select>
        <select id="session"><option value="default">Default</option></select>
        <button id="new-session">+ Project</button>
      </header>
      <div id="files" style="max-height:120px;overflow:auto;font-size:0.8rem;padding:0.5rem;border-bottom:1px solid #222;background:#111;"></div>
      <div id="messages"></div>
      <div id="composer">
        <textarea id="prompt" placeholder="Build something..."></textarea>
        <div class="actions">
          <button id="send" class="primary">Send</button>
          <button id="refresh">Refresh</button>
          <button id="clear">Clear</button>
        </div>
      </div>
    </aside>
    <main id="preview">
      <div class="preview-header">Live Preview</div>
      <iframe id="frame" src="/preview/?session=default"></iframe>
    </main>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
