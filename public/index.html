<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>W-Code</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div id="app">
    <aside id="chat">
      <header>
        <div class="logo">W-Code</div>
        <select id="provider"></select>
        <select id="model"></select>
        <select id="session"><option value="default">Default</option></select>
        <button id="new-session" title="New"><img src="/icons/plus.svg" width="16" height="16"></button>
        <button id="settings-btn" title="Settings"><img src="/icons/settings.svg" width="16" height="16"></button>
        <button id="templates-btn" title="Templates">Tpl</button>
      </header>
      <div id="settings-panel" class="panel" style="display:none">
        <h4>Settings</h4>
        <label>API Key <input id="api-key" type="password"></label>
        <label>Temperature <input id="temperature" type="number" min="0" max="2" step="0.1" value="0.2"></label>
        <label>Max Tokens <input id="max-tokens" type="number" value="4096"></label>
        <label>Theme <select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label>
        <button id="save-settings" class="primary">Save</button>
        <button id="export-settings">Export</button>
        <button id="import-settings">Import</button>
        <input type="file" id="import-file" accept=".json" style="display:none">
      </div>
      <div id="templates-panel" class="panel" style="display:none">
        <h4>Templates</h4>
        <div id="template-list"></div>
      </div>
      <div id="files"></div>
      <div id="messages"></div>
      <div id="status"></div>
      <div id="composer">
        <textarea id="prompt" placeholder="Describe what you want to build..."></textarea>
        <div class="actions">
          <button id="send" class="primary"><img src="/icons/send.svg" width="16" height="16"> Send</button>
          <button id="refresh"><img src="/icons/refresh.svg" width="16" height="16"></button>
          <button id="clear">Clear</button>
        </div>
      </div>
    </aside>
    <main id="preview">
      <div class="preview-header">
        <span>Live Preview</span>
        <select id="device">
          <option value="desktop">Desktop</option>
          <option value="tablet">Tablet</option>
          <option value="mobile">Mobile</option>
        </select>
        <span id="preview-url">/</span>
      </div>
      <iframe id="frame" src="/preview/?session=default"></iframe>
    </main>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
