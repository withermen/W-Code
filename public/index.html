<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>W-Code</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div id="app">
    <aside id="chat">
      <header>
        <div class="logo">W-Code</div>
        <select id="provider"></select>
        <select id="model"></select>
        <select id="session"><option value="default">Default</option></select>
        <button id="new-session">+ New</button>
        <button id="settings-btn">⚙</button>
      </header>
      <div id="settings" style="display:none; padding:0.6rem; background:#111; border-bottom:1px solid #2a2a2a;">
        <input id="api-key" type="password" placeholder="API Key" style="width:100%; padding:0.4rem; background:#0c0c0c; border:1px solid #2a2a2a; color:white; border-radius:4px; margin-bottom:0.4rem;">
        <button id="save-key" class="primary" style="width:100%;">Save Key for this Provider</button>
      </div>
      <div id="files"></div>
      <div id="messages"></div>
      <div id="status"></div>
      <div id="composer">
        <textarea id="prompt" placeholder="Describe what you want to build..."></textarea>
        <div class="actions">
          <button id="send" class="primary">Send</button>
          <button id="refresh">Refresh</button>
          <button id="clear">Clear</button>
        </div>
      </div>
    </aside>
    <main id="preview">
      <div class="preview-header">
        <span>Live Preview</span>
        <span id="preview-url">/</span>
      </div>
      <iframe id="frame" src="/preview/?session=default"></iframe>
    </main>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
