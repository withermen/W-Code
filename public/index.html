<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>W-Code</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <aside id="chat">
      <header>
        <div class="logo">W-Code</div>
        <select id="provider"></select>
        <select id="model"></select>
        <select id="session"><option value="default">Default</option></select>
        <button id="new-session" title="New project"><img src="/icons/plus.svg" width="16" height="16" alt=""></button>
        <button id="github-btn" title="GitHub">GitHub</button>
        <button id="git-btn" title="Git">Git</button>
        <button id="settings-btn" title="Settings"><img src="/icons/settings.svg" width="16" height="16" alt=""></button>
      </header>

      <div id="github-panel" class="panel" style="display:none">
        <h4>GitHub</h4>
        <input id="gh-token" type="password" placeholder="Personal Access Token">
        <button id="gh-connect" class="primary" style="margin-top:0.4rem;width:100%">Connect</button>
        <div id="gh-user" style="margin:0.5rem 0;font-size:0.85rem;color:var(--text-secondary)"></div>
        <select id="gh-repos"><option>Select repository...</option></select>
        <button id="gh-select" style="margin-top:0.4rem;width:100%">Use this repo</button>
        <div id="gh-selected" style="margin-top:0.4rem;font-size:0.8rem;color:var(--muted)"></div>
        <input id="target-file" placeholder="Target file path" style="margin-top:0.6rem">
        <button id="push-target" class="primary" style="margin-top:0.4rem;width:100%">Push to GitHub</button>
      </div>

      <div id="git-panel" class="panel" style="display:none">
        <h4>Local Git</h4>
        <div id="git-branch" style="font-size:0.85rem;margin-bottom:0.3rem"></div>
        <div id="git-status" style="font-family:ui-monospace,monospace;font-size:0.78rem;max-height:70px;overflow:auto;color:var(--text-secondary)"></div>
        <input id="commit-msg" placeholder="Commit message" style="margin-top:0.4rem">
        <div style="display:flex;gap:0.4rem;margin-top:0.4rem">
          <button id="git-commit" class="primary">Commit</button>
          <button id="git-diff">Diff</button>
        </div>
        <pre id="git-output" style="font-size:0.75rem;max-height:100px;overflow:auto;background:var(--bg);padding:0.5rem;margin-top:0.5rem;border-radius:6px;border:1px solid var(--border)"></pre>
      </div>

      <div id="settings-panel" class="panel" style="display:none">
        <h4>Settings</h4>
        <label>API Key <input id="api-key" type="password" placeholder="sk-..."></label>
        <label>Theme
          <select id="theme">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </label>
        <button id="save-settings" class="primary" style="margin-top:0.5rem;width:100%">Save</button>
      </div>

      <div id="files"></div>
      <div id="messages"></div>
      <div id="status"></div>
      <div id="composer">
        <textarea id="prompt" placeholder="Describe what you want to build..."></textarea>
        <div class="actions">
          <button id="send" class="primary"><img src="/icons/send.svg" width="16" height="16" alt=""> Send</button>
          <button id="refresh"><img src="/icons/refresh.svg" width="16" height="16" alt=""></button>
          <button id="clear">Clear</button>
        </div>
      </div>
    </aside>
    <main id="preview">
      <div class="preview-header">
        <span>Live Preview</span>
        <select id="device">
          <option value="desktop">Desktop</option>
          <option value="tablet">Tablet</option>
          <option value="mobile">Mobile</option>
        </select>
        <span id="preview-url" style="margin-left:auto;font-family:ui-monospace,monospace">/</span>
      </div>
      <iframe id="frame" src="/preview/?session=default"></iframe>
    </main>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
